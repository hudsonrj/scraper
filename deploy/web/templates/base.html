<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Newsloop{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
:root{--paper:#fff;--ink:#111;--muted:#5d5d5a;--faint:#c4c4c0;--rule:#d9d9d5;--hl:#ececea;--chip:#f4f4f2;
--serif:"STIX Two Text","Times New Roman",serif;--sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#141413;--ink:#ecebe6;--muted:#a3a29c;--faint:#55544f;--rule:#34332f;--hl:#25241f;--chip:#1d1c19;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;padding:24px max(16px,env(safe-area-inset-left)) 48px}
.page{max-width:1040px;margin:0 auto}
.running{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--sans);font-size:13px;color:var(--muted);border-bottom:2px solid var(--ink);padding-bottom:8px}
.running a{color:var(--ink)}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:26px 0 6px}
h2{font-size:20px;font-variant:small-caps;letter-spacing:.03em;margin:28px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.lead{font-style:italic;color:var(--muted);margin:0 0 10px}
.stats{display:flex;gap:28px;flex-wrap:wrap;font-family:var(--sans);margin:14px 0}
.stats div{display:flex;flex-direction:column}
.stats .v{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stats .l{font-size:12px;color:var(--muted)}
ul.checks{list-style:none;padding:0;margin:0;font-family:var(--sans);font-size:14px;display:grid;gap:4px}
ul.checks li{display:grid;grid-template-columns:26px 1fr}
.pill{display:inline-block;font-family:var(--sans);font-size:11.5px;font-weight:600;border:1.4px solid var(--ink);border-radius:999px;padding:0 7px;line-height:18px;text-align:center}
.pill.ok{background:var(--ink);color:var(--paper)}
.pill.warn{border-style:dashed}
pre{font-family:var(--mono);font-size:12.5px;background:var(--chip);border:1.5px solid var(--ink);border-radius:4px;padding:12px;overflow-x:auto;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-weight:400;font-style:italic;text-align:left;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:6px}
td{padding:6px;border-bottom:1px solid var(--rule);vertical-align:top}
.tablewrap{overflow-x:auto}
a{color:var(--ink)}
button,.btn{font-family:var(--sans);font-size:14px;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:4px;padding:8px 14px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-decoration:none;display:inline-block}
button.primary{background:var(--ink);color:var(--paper)}
input[type=text]{font-family:var(--mono);font-size:14px;padding:8px;border:1.5px solid var(--ink);border-radius:4px;background:var(--chip);color:var(--ink);width:min(100%,420px)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card{border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:3px;padding:18px 20px;margin:16px 0}
.meta{font-family:var(--sans);font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
</style>
</head>
<body><div class="page">
<div class="running"><span><a href="/">O Fim da Engenharia de Harness</a> · <a href="/painel">painel</a> · <a href="/revisar">revisar a prova</a></span><span>newsloop · classificador de temas do Diário Oficial</span></div>
{% block body %}{% endblock %}
</div></body></html>
